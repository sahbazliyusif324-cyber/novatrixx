<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121317;
    --panel: #1a1c22;
    --panel-2: #20222a;
    --border: #2b2e37;
    --text: #ECE9E2;
    --muted: #8d909c;
    --accent: #cba36b;
    --accent-soft: rgba(203,163,107,0.14);
    --user-bubble: #262933;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(203,163,107,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:28px 20px 20px;
  }
  .nova-mark{
    position:relative;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(203,163,107,0.6);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(203,163,107,0.45); }
    70%{ box-shadow:0 0 0 10px rgba(203,163,107,0); }
    100%{ box-shadow:0 0 0 0 rgba(203,163,107,0); }
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
  }

  main{
    flex:1;
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:10px 20px 140px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    max-width:380px;
  }
  .empty-state .big{
    font-family:'Fraunces', serif;
    font-size:28px;
    color:var(--text);
    margin-bottom:10px;
    font-weight:500;
  }
  .empty-state p{
    font-size:14.5px;
    line-height:1.6;
    margin:0;
  }

  .msg{
    display:flex;
    animation:rise .35s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg.user{ justify-content:flex-end; }
  .msg.nova{ justify-content:flex-start; }

  .bubble{
    max-width:78%;
    padding:13px 17px;
    border-radius:14px;
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .msg.user .bubble{
    background:var(--user-bubble);
    border:1px solid var(--border);
    border-bottom-right-radius:4px;
    color:var(--text);
  }
  .msg.nova .bubble{
    background:transparent;
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
    color:var(--text);
    position:relative;
  }
  .nova-label{
    font-family:'Fraunces', serif;
    font-size:12px;
    color:var(--accent);
    margin-bottom:4px;
    letter-spacing:0.03em;
  }

  .typing{
    display:flex;
    gap:4px;
    padding:6px 2px;
  }
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--accent);
    opacity:0.5;
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:0.2s;}
  .typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{
    0%,80%,100%{opacity:0.25; transform:scale(0.85);}
    40%{opacity:1; transform:scale(1);}
  }

  footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:18px 20px 26px;
    background:linear-gradient(180deg, transparent, var(--bg) 40%);
  }
  .input-wrap{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:6px 6px 6px 18px;
    transition:border-color .2s, box-shadow .2s;
  }
  .input-wrap:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  textarea{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:'Manrope', sans-serif;
    font-size:15px;
    line-height:1.5;
    max-height:140px;
    padding:10px 0;
  }
  textarea::placeholder{ color:var(--muted); }

  button.send{
    flex-shrink:0;
    width:38px;
    height:38px;
    border-radius:11px;
    border:none;
    background:var(--accent);
    color:#1a1509;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:filter .15s, transform .15s;
  }
  button.send:hover{ filter:brightness(1.08); }
  button.send:active{ transform:scale(0.94); }
  button.send:disabled{ opacity:0.4; cursor:default; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
</style>
</head>
<body>

<header>
  <div class="nova-mark"></div>
  <h1>Nova</h1>
</header>

<main id="chat">
  <div class="empty-state" id="emptyState">
    <div class="big">Salam.</div>
    <p>Nə barədə danışmaq istəyirsən? Nova sənin suallarına kömək etməyə hazırdır.</p>
  </div>
</main>

<footer>
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Mesaj yaz..."></textarea>
    <button class="send" id="sendBtn" aria-label="Göndər">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);

function addMessage(role, text) {
  if (emptyState) emptyState.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'nova');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'nova') {
    const label = document.createElement('div');
    label.className = 'nova-label';
    label.textContent = 'Nova';
    bubble.appendChild(label);
    const content = document.createElement('div');
    content.textContent = text;
    bubble.appendChild(content);
  } else {
    bubble.textContent = text;
  }
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
  return wrap;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg nova';
  wrap.id = 'typingIndicator';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="nova-label">Nova</div><div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    removeTyping();
    if (data.reply) {
      addMessage('nova', data.reply);
    } else {
      addMessage('nova', 'Xəta baş verdi: ' + (data.error || 'naməlum xəta'));
    }
  } catch (err) {
    removeTyping();
    addMessage('nova', 'Serverlə bağlantı xətası.');
  }
  sendBtn.disabled = false;
}
</script>

</body>
</html>
