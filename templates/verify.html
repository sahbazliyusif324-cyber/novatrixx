<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — Kodu daxil et</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121317; --panel:#1a1c22; --border:#2b2e37;
    --text:#ECE9E2; --muted:#8d909c; --accent:#cba36b; --accent-soft:rgba(203,163,107,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%, rgba(203,163,107,0.08), transparent 60%), var(--bg);
    font-family:'Manrope', sans-serif; color:var(--text);
  }
  .card{
    width:100%; max-width:380px; padding:36px 32px;
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:10px; }
  .nova-mark{
    width:9px; height:9px; border-radius:50%; background:var(--accent);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(203,163,107,0.45);}
    70%{box-shadow:0 0 0 10px rgba(203,163,107,0);}
    100%{box-shadow:0 0 0 0 rgba(203,163,107,0);}
  }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:20px; margin:0; }
  .subtitle{ text-align:center; color:var(--muted); font-size:13.5px; margin:0 0 26px; line-height:1.5; }
  .subtitle b{ color:var(--text); }
  input{
    width:100%; padding:14px; margin-bottom:18px;
    background:#20222a; border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'Manrope', sans-serif; font-size:22px; letter-spacing:8px; text-align:center;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button{
    width:100%; padding:13px; border:none; border-radius:10px;
    background:var(--accent); color:#1a1509; font-weight:700; font-size:15px;
    cursor:pointer; transition:filter .15s;
  }
  button:hover{ filter:brightness(1.08); }
  .flash{
    background:rgba(203,107,107,0.12); border:1px solid rgba(203,107,107,0.4);
    color:#e0a3a3; padding:10px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;
  }
  .resend{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--muted); }
  .resend a{ color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="nova-mark"></div>
      <h1>Nova</h1>
    </div>
    <p class="subtitle"><b>{{ email }}</b> ünvanına göndərilən 6 rəqəmli kodu yaz</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="text" name="code" maxlength="6" inputmode="numeric" pattern="[0-9]*" required placeholder="000000" autofocus>
      <button type="submit">Təsdiqlə</button>
    </form>
    <div class="resend">Kod gəlmədi? <a href="/resend">Yenidən göndər</a></div>
  </div>
</body>
</html>
